name: OpenDev Web - CI

on:
  push:
    paths:
      - 'OpenDev-web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'OpenDev-web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: OpenDev-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: OpenDev-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: opendev-web-${{ github.sha }}
          path: OpenDev-web/dist/
          if-no-files-found: error
          retention-days: 14

