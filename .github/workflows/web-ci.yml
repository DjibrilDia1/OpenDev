name: OpenDev Web - CI

on:
  push:
    paths:
      - 'OpenDev-web/**'
      - '.github/workflows/web-ci.yml'
      - '.github/scripts/wait-for-container.sh'
      - 'compose*.yml'
  pull_request:
    paths:
      - 'OpenDev-web/**'
      - '.github/workflows/web-ci.yml'
      - '.github/scripts/wait-for-container.sh'
      - 'compose*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OpenDev-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: OpenDev-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: opendev-web-${{ github.sha }}
          path: OpenDev-web/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Build production and development containers
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          docker build --target production -t opendev-web:ci \
            --build-arg VITE_SUPABASE_URL \
            --build-arg VITE_SUPABASE_ANON_KEY \
            --build-arg VITE_API_URL=/api/v1 .
          docker build --target development -t opendev-web:dev .
      - name: Lint inside the development container
        run: docker run --rm --entrypoint npm opendev-web:dev run lint
      - name: Smoke test production container and SPA fallback
        run: |
          docker run -d --name web-ci -p 127.0.0.1:18080:8080 opendev-web:ci
          bash ../.github/scripts/wait-for-container.sh web-ci 90
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18080/healthz
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18080/discover
      - name: Diagnose container failure
        if: failure()
        run: |
          docker inspect --format '{{json .State}}' web-ci || true
          docker logs --tail 100 web-ci || true
      - name: Stop production container
        if: always()
        run: docker rm -f web-ci || true

