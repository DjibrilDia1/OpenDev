name: OpenDev API - CI

on:
  push:
    paths:
      - 'OpenDev-api/**'
      - '.github/workflows/api-ci.yml'
      - '.github/scripts/wait-for-container.sh'
      - '.github/workflows/deploy-database.yml'
      - 'compose*.yml'
  pull_request:
    paths:
      - 'OpenDev-api/**'
      - '.github/workflows/api-ci.yml'
      - '.github/scripts/wait-for-container.sh'
      - '.github/workflows/deploy-database.yml'
      - 'compose*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OpenDev-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: OpenDev-api/uv.lock
      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --extra dev
      - name: Lint
        run: uv run --locked --extra dev ruff check app tests
      - name: Check formatting
        run: uv run --locked --extra dev ruff format --check app tests
      - name: Test API and access token forwarding
        run: uv run --locked --extra dev python -m pytest -q
      - name: Build API package
        run: uv run --locked --extra dev python -m build
      - name: Build production and development containers
        run: |
          docker build --target production -t opendev-api:ci .
          docker build --target development -t opendev-api:dev .
      - name: Test inside the development container
        run: docker run --rm --entrypoint python opendev-api:dev -m pytest -q
      - name: Smoke test production container
        run: |
          docker run -d --name api-ci -p 127.0.0.1:18000:8000 opendev-api:ci
          bash ../.github/scripts/wait-for-container.sh api-ci 90
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18000/api/v1/health
      - name: Diagnose container failure
        if: failure()
        run: |
          docker inspect --format '{{json .State}}' api-ci || true
          docker logs --tail 100 api-ci || true
      - name: Stop production container
        if: always()
        run: docker rm -f api-ci || true
      - uses: actions/upload-artifact@v4
        with:
          name: opendev-api-${{ github.sha }}
          path: OpenDev-api/dist/
          if-no-files-found: error
          retention-days: 14

  database:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OpenDev-api
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start temporary local Supabase
        run: supabase start
      - name: Apply all migrations from scratch
        run: supabase db reset --local --no-seed
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
