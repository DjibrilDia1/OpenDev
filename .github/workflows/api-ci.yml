name: OpenDev API - CI

on:
  push:
    paths:
      - 'OpenDev-api/**'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/deploy-database.yml'
  pull_request:
    paths:
      - 'OpenDev-api/**'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: OpenDev-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: OpenDev-api/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' build
      - name: Lint
        run: ruff check app tests
      - name: Check formatting
        run: ruff format --check app tests
      - name: Test API and access token forwarding
        run: python -m pytest -q
      - name: Build API package
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: opendev-api-${{ github.sha }}
          path: OpenDev-api/dist/
          if-no-files-found: error
          retention-days: 14

  database:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OpenDev-api
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start temporary local Supabase
        run: supabase start
      - name: Apply all migrations from scratch
        run: supabase db reset --local --no-seed
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
