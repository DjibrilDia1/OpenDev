name: Deploy Supabase migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  checks:
    name: Validate before deploying
    uses: ./.github/workflows/api-ci.yml

  migrate:
    name: Apply production migrations
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: OpenDev-api
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check deployment configuration
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing deployment configuration: $name"
              exit 1
            fi
          done
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview pending migrations
        run: supabase db push --dry-run
      - name: Apply pending migrations
        run: supabase db push --yes
      - name: Show migration history
        run: supabase migration list
