[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendev-api"
version = "0.1.0"
description = "Business logic API for the OpenDev community."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.10,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9.0", "ruff>=0.13,<1.0", "build>=1.3,<2.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python = "./.venv"

[tool.pyright]
venvPath = "."
venv = ".venv"
